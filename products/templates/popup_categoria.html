<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Exemplo: Modal Criar Categoria</title>
  <link rel="stylesheet" href="static\css\popup_categoria.css" />
</head>
<style>
    * { box-sizing: border-box; }
html,body { height:100%; margin:0; font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; color:#222; }
button { font: inherit; cursor: pointer; }

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none; /* mostrará via JS */
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 24px;
}

.overlay.show { display: flex; }

/* ---------- MODAL ---------- */
.modal {
    width: 620px;
    max-width: calc(100% - 48px);
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    padding: 36px 48px 40px 48px;
    position: relative;
    transform: translateY(-12px);
    opacity: 0;
    transition: transform .22s ease, opacity .22s ease;
    outline: none;
}

.overlay.show .modal {
    transform: translateY(0);
    opacity: 1;
}

/* ---------- HEADER ---------- */
.modal-header {
    text-align: center;
    margin-bottom: 18px;
}

.modal h2 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    color: #2b2b2b;
}

.modal p.description {
    margin: 10px 0 0 0;
    color: #9b9b9b;
    font-size: 14px;
}

/* ---------- CLOSE (X) ---------- */
.close-btn {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4b4b4b;
    font-size: 20px;
}

.close-btn:hover { color: #000; }

/* ---------- FORM ---------- */
form {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    align-items: flex-start;
}

.input-wrap {
    width: 100%;
}

label.visually-hidden {
    position: absolute !important;
    height: 1px; width: 1px; overflow: hidden;
    clip: rect(1px,1px,1px,1px);
    white-space: nowrap;
}

input[type="text"] {
    width: 100%;
    height: 40px;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1.5px solid #e6e6e6;
    background: #fff;
    font-size: 14px;
    color: #333;
    transition: box-shadow .12s ease, border-color .12s ease;
}
input[type="text"]::placeholder { color: #c9c9c9; }

input[type="text"]:focus {
    outline: none;
    border-color: #d3d9ff;
    box-shadow: 0 0 0 4px rgba(211,217,255,0.45);
}

.error {
    color: #b82b2b;
    font-size: 13px;
    margin-top: 6px;
    display: none;
}
.error.show { display: block; }

/* ---------- FOOTER / BOTÃO SALVAR ---------- */
.actions {
    width:100%;
    display:flex;
    justify-content:flex-end;
}

.save-btn {
    min-width:120px;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #22252c; /* cor escura semelhante à imagem */
    color:#fff;
    font-weight:500;
    font-size:16px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08);
}

.save-btn:active { transform: translateY(1px); }

/* ---------- RESPONSIVO ---------- */
@media (max-width:480px) {
    .modal { padding: 24px; border-radius: 10px; }
    .modal h2 { font-size: 22px; }
    .save-btn { width: 100%; }
    .actions { justify-content: center; }
}
</style>
<body>

  <!-- BOTÃO ABRIR (só para demonstração) -->
  <button class="open-btn" id="openModal">Abrir modal</button>

  <!-- OVERLAY + MODAL -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc" tabindex="-1">
      <button class="close-btn" id="closeBtn" aria-label="Fechar modal">&times;</button>

      <header class="modal-header">
        <h2 id="modalTitle">Crie sua nova categoria</h2>
        <p id="modalDesc" class="description">Preencha abaixo os dados da sua categoria</p>
      </header>

      <form id="categoryForm" novalidate>
        <div class="input-wrap">
          <label for="categoryName" class="visually-hidden">Nome da categoria</label>
          <input id="categoryName" name="categoryName" type="text" placeholder="Nome da categoria" autocapitalize="words" autocomplete="off" required />
          <div class="error" id="errorMsg">Por favor, insira um nome válido.</div>
        </div>

        <div class="actions">
          <button type="submit" class="save-btn" id="saveBtn">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function(){
      const openBtn = document.getElementById('openModal');
      const overlay = document.getElementById('overlay');
      const modal = overlay.querySelector('.modal');
      const closeBtn = document.getElementById('closeBtn');
      const form = document.getElementById('categoryForm');
      const input = document.getElementById('categoryName');
      const errorMsg = document.getElementById('errorMsg');

      let lastFocusedElement = null;

      // Abertura do modal
      function openModal() {
        lastFocusedElement = document.activeElement;
        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden','false');
        document.body.style.overflow = 'hidden'; // bloqueia scroll do body
        // colocar foco no input
        setTimeout(() => input.focus(), 60);
        trapFocus(modal);
      }

      // Fechamento do modal
      function closeModal() {
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden','true');
        document.body.style.overflow = '';
        removeTrap();
        if (lastFocusedElement) lastFocusedElement.focus();
      }

      // Validação simples: não vazio e sem só espaços
      function validateName(value) {
        if (!value) return false;
        return value.trim().length > 0;
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = input.value;
        if (!validateName(val)) {
          errorMsg.classList.add('show');
          input.setAttribute('aria-invalid','true');
          input.focus();
          return;
        }
        errorMsg.classList.remove('show');
        input.removeAttribute('aria-invalid');

        // ---------- AQUI: envio dos dados ----------
        // Exemplo: enviar via fetch para /api/categories (mock)
        // fetch('/api/categories', { method:'POST', body: JSON.stringify({ name: val }), headers: {'Content-Type':'application/json'}})
        //  .then(r => r.json()).then(data => { ... })

        // Por enquanto, só fechamos e exibimos um console (ou trata conforme seu backend)
        console.log('Criando categoria:', val);
        closeModal();
      });

      openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);

      // Fechar com overlay click (fora do modal)
      overlay.addEventListener('mousedown', (e) => {
        if (!modal.contains(e.target)) closeModal();
      });

      // Fechar com ESC
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('show')) {
          closeModal();
        }
      });

      // ------------------ TRAP DE FOCO SIMPLES ------------------
      let focusListener = null;
      function trapFocus(container) {
        const focusableSelectors = 'a[href], area[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]), iframe, [tabindex]:not([tabindex="-1"])';
        const nodes = Array.from(container.querySelectorAll(focusableSelectors)).filter(n => n.offsetWidth || n.offsetHeight || n.getClientRects().length);
        if (nodes.length === 0) return;
        const first = nodes[0];
        const last = nodes[nodes.length - 1];

        focusListener = function(e) {
          if (e.key !== 'Tab') return;
          if (e.shiftKey) {
            if (document.activeElement === first) {
              e.preventDefault();
              last.focus();
            }
          } else {
            if (document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        };
        document.addEventListener('keydown', focusListener);
      }

      function removeTrap() {
        if (focusListener) {
          document.removeEventListener('keydown', focusListener);
          focusListener = null;
        }
      }

      // Manter foco no modal quando clicado (tornar o modal o elemento focável)
      modal.addEventListener('click', () => modal.focus());
    })();
  </script>
</body>
</html>
